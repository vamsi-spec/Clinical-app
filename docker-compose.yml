services:
  # ============================================
  # POSTGRESQL DATABASE
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: clinical_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinical_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_db}
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clinical_user} -d ${POSTGRES_DB:-clinical_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinical_network

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: clinical_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - '6389:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinical_network

  # ============================================
  # OLLAMA — local LLM server
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: clinical_ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment below if you have NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinical_network


  # KAFKA — KRAFT MODE
  # Single node acts as both broker and controller,
  # which is exactly what local dev and a small production deployment need. 
  # Multi-node KRaft clusters split these roles across dedicated controller nodes

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: clinical_kafka
    ports:
      - '9092:9092'   #for host machine tools like kafdrop
      - '29092:29092' #for backend service
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT


      CLUSTER_ID: "cGNsaW5pY2FsLW5vdGU"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      volumes:
        - kafka_data:/var/lib/kafka/data
      healthcheck:
        test: ["CMD","kafka-topics","--bootstrap-server","localhost:9092","--list"]
        interval: 10s
        timeout: 10s
        retries: 10
        start_period: 20s
      networks:
        - clinical_network

kafka-ui:
  image: provectuslabs/kafka-ui:latest
  container_name: clinical_kafka_ui
  depends_on:
    - kafka
  ports:
    - "8090:8080"
  environment:
    KAFKA_CLUSTERS_0_NAME: clinical-local
    KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    # KAFKA_CLUSTERS_0_ZOOKEEPER line removed — KRaft has no Zookeeper
  networks:
    - clinical_network



  # ============================================
  # BACKEND — Node.js + Express
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
      - '5555:5555'
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clinical_user}:${POSTGRES_PASSWORD:-clinical_pass}@postgres:5432/${POSTGRES_DB:-clinical_db}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinical_network

  # ============================================
  # ML SERVICE — Python FastAPI
  # ============================================
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: clinical_ml
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./ml-service/.env
    volumes:
      - ./ml-service:/app
      - ml_model_cache:/root/.cache
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - clinical_network

  # ============================================
  # FRONTEND — React + Vite
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinical_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - clinical_network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
  redis_data:
  ollama_models:
  ml_model_cache:

# ============================================
# NETWORKS
# ============================================
networks:
  clinical_network:
    driver: bridge